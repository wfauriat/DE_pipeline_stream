# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml: the whole stack, one service per box of PLAN.md §5.
#
# Who reads it: `docker compose`, usually through the Makefile (make up / down
# / logs / ps). ${VARS} come from .env (template: .env.example). The value
# after ":-" is the default used when a variable is unset.
#
# Networking: every service joins the project network (de-modern_default) and
# reaches the others by SERVICE NAME, e.g. http://source-api:8000. The host
# ports (left side of "ports:") are only for you: browser, curl, local tools.
#
# This file grows layer by layer:
#   1 source-api · 2 kafka, kafka-init, bridge, console · 3 spark · 4–5 airflow
# ─────────────────────────────────────────────────────────────────────────────
name: de-modern

services:
  # ── Layer 1: the synthetic upstream system (the "vendor") ───────────────────
  source-api:
    build:
      context: .                        # repo root: the Dockerfile needs uv.lock
      dockerfile: source/Dockerfile
    image: de-modern/source-api:dev
    # Run as you, so data/source/state.pkl on the host belongs to you, not root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Read by bikeshare_sim/config.py. Paths are relative to WORKDIR /app.
      BIKESHARE_CONFIG: config/source.toml
      SIM_STATE_DIR: data/source
      SIM_SEED: ${SIM_SEED:-42}
      SIM_SPEED: ${SIM_SPEED:-60}
      # Read by bikeshare_sim/__main__.py
      SOURCE_PORT: "8000"
    volumes:
      - ./config:/app/config:ro         # edit config/source.toml on the host, then restart
      - ./data/source:/app/data/source  # state.pkl: world, clock, event buffer, fault log
    ports:
      - "${SOURCE_API_PORT:-8000}:8000"  # host:container → http://localhost:8000/docs
    healthcheck:
      # Other services will wait for this (depends_on: condition: service_healthy).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Time to close SSE streams and save state.pkl on `docker compose down`.
    stop_grace_period: 20s
    restart: unless-stopped
